<!doctype html>
<html lang="ml" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b4ce6" />
    <meta
      name="description"
      content="MYFIN — നിത്യജീവിതത്തിലെ വരവും ചെലവും രേഖപ്പെടുത്താനുള്ള സമ്പൂർണ്ണ മലയാളം ഫിനാൻസ് മാനേജ്മെന്റ് വെബ് ആപ്പ്"
    />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>MYFIN — മലയാളം ഫിനാൻസ് മാനേജ്മെന്റ്</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('myfin_theme');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
